# Render blueprint: the RamanHub API + managed Postgres.
# The web app (apps/web) lives on Vercel with Root Directory = apps/web;
# object storage on Cloudflare R2. Full topology + every env var documented
# in README.md's Deployment section.
#
# Use: Render dashboard -> New -> Blueprint -> point at this repo. Values
# marked `sync: false` are secrets you paste in the dashboard on first
# deploy; everything else is committed here.
services:
  - type: web
    name: ramanhub-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # Overrides the Dockerfile's dev CMD: bind to Render's $PORT, no
    # --reload, and trust the proxy's X-Forwarded-* headers so the app
    # knows it's serving https.
    dockerCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    # Migrations + reference data run before each deploy goes live.
    # `seed_data` is idempotent (check-exists-first) and is NOT optional: it
    # creates the licenses, metadata field definitions and ledger step
    # definitions the app requires. Without it `GET /licenses` is empty and
    # publishing a finding 422s, because publish requires a license_id.
    # NOTE: preDeployCommand requires a paid instance type; on the free tier,
    # remove this and run both commands from the service Shell after deploys.
    preDeployCommand: uv run alembic upgrade head && uv run python -m app.seed.seed_data
    healthCheckPath: /health
    # starter = always-on (~$7/mo). `free` exists but spins down after
    # idle (first request after sleep takes ~1 min) and disallows
    # preDeployCommand.
    plan: starter
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      # Domain layout per ADR-014: spectra-in.site = product identity,
      # raman.spectra-in.site = this application, api.spectra-in.site = the API.
      - key: FRONTEND_URL
        value: https://raman.spectra-in.site
      - key: BACKEND_URL
        value: https://api.spectra-in.site
      # The app and the API are sibling subdomains, so auth cookies MUST carry
      # the shared registrable parent — a host-only cookie set by the API is
      # never sent to the web origin and sign-in silently fails to stick.
      # This is invisible in local dev, where both halves are `localhost`.
      - key: COOKIE_DOMAIN
        value: .spectra-in.site
      - key: GOOGLE_REDIRECT_URI
        value: https://api.spectra-in.site/auth/callback
      # GitHub + ORCID sign-in (M3). Keep the host in lock-step with
      # BACKEND_URL / GOOGLE_REDIRECT_URI above — change them together
      # if the domain changes. docs/OPERATIONS.md section 5.
      - key: GITHUB_REDIRECT_URI
        value: https://api.spectra-in.site/auth/github/callback
      # ORCID has two distinct flows and they must stay on DIFFERENT paths:
      # ORCID_REDIRECT_URI is the proof-of-control *link* flow (an existing
      # signed-in user attaching their ORCID); ORCID_LOGIN_REDIRECT_URI is the
      # *sign-in* flow. Pointing both at the sign-in callback — as this file
      # previously did — sends linking users through login instead.
      - key: ORCID_REDIRECT_URI
        value: https://api.spectra-in.site/users/me/orcid/callback
      - key: ORCID_LOGIN_REDIRECT_URI
        value: https://api.spectra-in.site/auth/orcid/callback
      # "production" (orcid.org) or "sandbox" (sandbox.orcid.org). Switch to
      # sandbox while production ORCID credentials are still pending approval.
      - key: ORCID_ENV
        value: production
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET_RAW
        value: raw-spectra
      - key: S3_BUCKET_PROCESSED
        value: processed-spectra
      - key: S3_BUCKET_FIGURES
        value: figures
      # LLM routing (OpenRouter). Operator can override the model to a
      # cheaper/smaller one; the API key is a dashboard secret below.
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: DATABASE_URL
        fromDatabase:
          name: ramanhub-db
          property: connectionString
      # --- Secrets: paste in the dashboard (never committed) -------------
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: ORCID_CLIENT_ID
        sync: false
      - key: ORCID_CLIENT_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Cloudflare R2: https://<account-id>.r2.cloudflarestorage.com + an
      # R2 API token's key id/secret.
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Optional; error tracking is a no-op while empty.
      - key: SENTRY_DSN
        sync: false

  # Parsing runs OUT OF PROCESS. `POST /raw-files` only enqueues an
  # IngestionJob; without this service every upload sits at status=pending
  # forever and the upload wizard never completes. It serves no HTTP, so it is
  # a `worker`, not a `web` service, and gets no healthCheckPath.
  #
  # Migrations are owned by the API service's preDeployCommand — deliberately
  # not repeated here, so two services never race to run them.
  - type: worker
    name: ramanhub-ingestion-worker
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: uv run python -m app.ingestion.worker
    plan: starter
    autoDeploy: true
    envVars:
      # The worker needs the same database, object store and LLM credentials
      # as the API. `fromService` copies whatever the API service is using so
      # the two cannot drift apart.
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ramanhub-db
          property: connectionString
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET_RAW
        value: raw-spectra
      - key: S3_BUCKET_PROCESSED
        value: processed-spectra
      - key: S3_BUCKET_FIGURES
        value: figures
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Header parsing falls back to an LLM when no deterministic vendor
      # parser matches; without a key that fallback is a documented no-op.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: JWT_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false

databases:
  - name: ramanhub-db
    # basic-256mb (~$6/mo) — the `free` Postgres plan is deleted after 30
    # days, which is unacceptable for a live database.
    plan: basic-256mb
    postgresMajorVersion: "16"
