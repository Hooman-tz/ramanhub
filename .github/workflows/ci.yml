# Lint, type-check and test both sides on every push and pull request.
#
# This is what makes the Dependabot PRs configured in dependabot.yml safe to
# merge: an alert that a dependency needs bumping is only actionable if
# something checks that the bump doesn't break anything.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # The DB-backed tests skip themselves when no Postgres is reachable, so
    # without a service container CI would pass while silently running a
    # fraction of the suite. pgcrypto (for gen_random_uuid) comes from the
    # standard postgres image; the test harness creates the extension and
    # the sibling `_test` database itself.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: raman
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: ramanhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://raman:changeme@localhost:5432/ramanhub
      # Most tests stub object storage (the `fake_s3` fixture), but the
      # ingestion-API tests don't patch `object_exists`, which `POST /raw-files`
      # calls before uploading. With the default STORAGE_BACKEND=s3 that dials
      # MinIO on localhost:9000 and 5 tests fail with EndpointConnectionError.
      # The filesystem backend needs no service container.
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: /tmp/ci-storage
      JWT_SECRET: ci-only-not-a-real-secret

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      # A model change that never got a migration passes the test suite
      # (which builds its tables from the models directly) and then fails on
      # deploy. These two steps catch that: the migrations must run cleanly
      # from scratch, and must leave a schema that autogenerate has nothing
      # left to add.
      - name: Run migrations from scratch
        run: uv run alembic upgrade head

      - name: Assert a single Alembic head
        run: |
          n=$(uv run alembic heads | grep -c '(head)')
          test "$n" -eq 1 || { echo "expected 1 alembic head, found $n"; uv run alembic heads; exit 1; }

      - name: Check for model/migration drift
        run: uv run alembic check

  web:
    # The pnpm/Turborepo frontend workspace (apps/web + packages/*). The old
    # Vite `frontend/` app and its Playwright e2e job were retired in M4; an
    # `apps/web` e2e suite comes back in a later milestone.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      # next.config.js sets `typescript.ignoreBuildErrors`, so the build alone
      # is not a type gate — the Type-check step above is. Lint is a gate too:
      # `no-restricted-properties` (raw process.env) is error-severity here.
      - name: Lint
        run: pnpm --filter @ramanhub/web lint

      - name: Build web
        run: pnpm --filter @ramanhub/web build
