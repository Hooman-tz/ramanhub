# GitHub Dependabot config (Module 5: "Turn on GitHub Dependabot (free) for
# automatic dependency vulnerability alerts on both the Python and JS
# sides"). Free, needs no further setup beyond this file being present on
# the default branch once pushed to GitHub — Dependabot opens PRs
# automatically on this schedule.
version: 2
updates:
  # Backend — Python / uv (pyproject.toml + uv.lock)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Frontend — npm (package.json + package-lock.json)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # GitHub Actions workflow versions themselves, if/when CI is added — cheap
  # to enable now, no-ops until a .github/workflows/*.yml exists.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
