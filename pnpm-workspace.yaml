packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  "@better-auth/cli": 1.4.0-beta.9
  "@better-auth/expo": 1.4.0-beta.9
  "@eslint/js": ^9.38.0
  "@tailwindcss/postcss": ^4.1.16
  "@tailwindcss/vite": ^4.1.16
  "@tanstack/react-form": ^1.23.8
  "@tanstack/react-query": ^5.90.8
  "@trpc/client": ^11.7.1
  "@trpc/server": ^11.7.1
  "@trpc/tanstack-react-query": ^11.7.1
  "@types/node": ^22.18.12
  "@vitejs/plugin-react": 5.1.0
  better-auth: 1.4.0-beta.9
  eslint: ^9.38.0
  prettier: ^3.6.2
  tailwindcss: ^4.1.16
  typescript: ^5.9.3
  zod: ^4.1.12
  vite: 7.1.12

catalogs:
  react19:
    "@types/react": ~19.2.18
    "@types/react-dom": ~19.1.0
    react: 19.2.8
    react-dom: 19.1.4

linkWorkspacePackages: true

# Don't hard-fail every `pnpm <script>` when optional native build scripts
# (sharp, bufferutil, …) are un-run; warn instead.
verifyDepsBeforeRun: warn

# Per-dependency decision on whether to run its install/postinstall script.
# pnpm 11 replaced pnpm 10's `onlyBuiltDependencies` / `ignoredBuiltDependencies`
# lists with this map, and refuses to install (ERR_PNPM_IGNORED_BUILDS) until
# every package that ships a build script has an explicit true/false here.
# pnpm appends a stub with "set this to true or false" placeholders when a
# decision is missing: answer it, don't delete it — deleting the stub and
# using the old list keys (which pnpm 11 silently ignores) is what kept CI red.
allowBuilds:
  "@tailwindcss/oxide": true # Tailwind v4 native engine
  esbuild: true # native binary shim
  sharp: true # Next.js image optimisation
  bufferutil: true # optional native WebSocket speedup
  core-js-pure: false # script only prints a funding notice

overrides:
  "@types/minimatch": 5.1.2
  lightningcss: 1.30.1
  vite: 7.1.12

publicHoistPattern:
  - "@ianvs/prettier-plugin-sort-imports"
  - prettier-plugin-tailwindcss
